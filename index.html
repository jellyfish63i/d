<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문이 있어요</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #ffe3ee 0%, #ffd0e2 50%, #ffc2d8 100%);
    font-family: "Jua", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #card {
    background: rgba(255, 255, 255, .75);
    border-radius: 32px;
    padding: 40px 32px 48px;
    width: min(88vw, 420px);
    box-shadow: 0 10px 30px rgba(255, 92, 141, .25);
    position: relative;
    z-index: 2;
  }
  #emoji {
    font-size: 72px;
    display: inline-block;
    animation: bob 1.4s ease-in-out infinite;
  }
  h1 {
    font-size: 28px;
    color: #ff4f86;
    margin: 12px 0 28px;
    font-weight: normal;
    line-height: 1.4;
    text-shadow: 0 2px 0 #fff;
  }
  #btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    min-height: 64px;
  }
  button {
    font-family: inherit;
    font-size: 20px;
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    cursor: pointer;
    transition: transform .15s;
  }
  #yes {
    background: linear-gradient(135deg, #ff7aa8, #ff4f86);
    color: #fff;
    box-shadow: 0 4px 0 #d93a6c;
  }
  #yes:active { transform: translateY(3px); box-shadow: 0 1px 0 #d93a6c; }
  #no {
    background: #fff;
    color: #999;
    box-shadow: 0 4px 0 #e2d3d9;
    transition: left .25s, top .25s, transform .15s;
  }
  #no.run { position: fixed; z-index: 5; }
  #result {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #ffe3ee, #ffb3cf);
    z-index: 10;
    color: #ff4f86;
  }
  #result.show { display: flex; animation: pop .5s ease-out; }
  #result .big { font-size: 96px; animation: bob 1s ease-in-out infinite; }
  #result p { font-size: 34px; margin: 16px 24px 0; text-shadow: 0 2px 0 #fff; line-height: 1.4; }
  .float {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: up linear forwards;
    z-index: 1;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-10px) scale(1.08); }
  }
  @keyframes pop {
    from { transform: scale(.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes up {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="card">
  <div id="emoji">🥺</div>
  <h1 id="q">나 좋아해?</h1>
  <div id="btns">
    <button id="yes">좋아 💗</button>
    <button id="no">싫어</button>
  </div>
</div>

<div id="result">
  <div class="big">💖</div>
  <p>나도 많이 좋아해 ♡</p>
</div>

<script>
  const QUESTION = "나 좋아해?";
  const ANSWER = "나도 많이 좋아해 ♡";
  const TEASE = ["진짜?", "한 번만 더 생각해봐 🥺", "눌러지겠어?", "아니지~?", "손이 미끄러졌지?", "그쪽 말고 옆이야", "좋아 누르면 되는데 😢"];

  document.getElementById("q").textContent = QUESTION;
  document.querySelector("#result p").textContent = ANSWER;

  const no = document.getElementById("no");
  const yes = document.getElementById("yes");
  const emoji = document.getElementById("emoji");
  const q = document.getElementById("q");
  let tries = 0;

  function runAway() {
    no.classList.add("run");
    const w = no.offsetWidth, h = no.offsetHeight;
    const x = Math.random() * (innerWidth - w - 20) + 10;
    const y = Math.random() * (innerHeight - h - 20) + 10;
    no.style.left = x + "px";
    no.style.top = y + "px";
    q.textContent = TEASE[tries % TEASE.length];
    emoji.textContent = ["😢", "🥺", "😭", "🙈"][tries % 4];
    tries++;
    yes.style.transform = "scale(" + Math.min(1 + tries * 0.12, 2) + ")";
  }

  no.addEventListener("pointerenter", runAway);
  no.addEventListener("pointerdown", e => { e.preventDefault(); runAway(); });

  yes.addEventListener("click", () => {
    document.getElementById("result").classList.add("show");
    for (let i = 0; i < 40; i++) setTimeout(spawn, i * 60);
    setInterval(spawn, 300);
  });

  const EMOJI = ["💗", "💖", "💕", "🌸", "✨", "🎀"];
  function spawn() {
    const s = document.createElement("span");
    s.className = "float";
    s.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 16 + Math.random() * 22 + "px";
    s.style.animationDuration = 5 + Math.random() * 4 + "s";
    s.style.zIndex = 20;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 10000);
  }
  setInterval(() => { if (!document.getElementById("result").classList.contains("show")) spawn(); }, 700);
</script>
</body>
</html>
